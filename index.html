<title>随机播放 · 等1000人觉得很赞</title>
<style>
:root{
  --bg:#0b0d14; --card:#161a26; --card2:#1d2231; --line:#2a3046;
  --tx:#eef1f8; --dim:#8b93a8; --accent:#c20c0c; --accent2:#ff3b3b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  overscroll-behavior:none}
body{min-height:100vh;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}

h1{font-size:19px;margin:0 0 4px;font-weight:650;letter-spacing:.2px}
.sub{color:var(--dim);font-size:13px;margin-bottom:20px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:22px 20px;margin-bottom:16px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;
  background:linear-gradient(180deg,var(--accent2),var(--accent));opacity:.9}

.songname{font-size:23px;font-weight:700;line-height:1.3;margin:0 0 10px;word-break:break-word}
.artist{color:var(--accent2);font-size:16px;font-weight:550;margin-bottom:6px;word-break:break-word}
.meta{color:var(--dim);font-size:13px;display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line)}

.idx{position:absolute;top:16px;right:18px;font-size:12px;color:var(--dim);
  font-variant-numeric:tabular-nums;background:var(--card2);padding:3px 9px;border-radius:20px}

.btns{display:flex;gap:10px;margin-bottom:16px}
button{flex:1;font:inherit;font-weight:600;border:none;border-radius:14px;padding:15px 12px;
  cursor:pointer;transition:transform .12s,opacity .12s;color:#fff}
button:active{transform:scale(.97);opacity:.85}
.next{background:linear-gradient(135deg,var(--accent2),var(--accent));font-size:17px;
  box-shadow:0 6px 20px rgba(194,12,12,.35)}
.play{background:var(--card2);border:1px solid var(--line);color:var(--tx)}

.row{display:flex;gap:10px;margin-bottom:16px}
.row button{background:var(--card);border:1px solid var(--line);color:var(--dim);
  font-size:13px;font-weight:500;padding:11px 8px;border-radius:12px}
.row button.on{color:var(--accent2);border-color:var(--accent)}

.hint{color:var(--dim);font-size:12px;text-align:center;line-height:1.7}
a{color:var(--accent2);text-decoration:none}
.hist{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 0;margin-bottom:16px}
.hitem{display:flex;gap:10px;padding:9px 16px;font-size:13px;color:var(--dim);
  border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer}
.hitem:last-child{border-bottom:none}
.hitem:active{background:var(--card2)}
.hitem .hn{color:var(--tx);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hitem .ha{max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:14px}
</style>
</head>

<div class="wrap">

</div>

<script>
var SONGS = window.SONGS || [];
var used = [];
var HIST = [];

var $ = function(id){ return document.getElementById(id); };
$('total').textContent = SONGS.length;

function fmtDur(d){ return d; }

function pick(){
  var pool = SONGS;
  if($('avoid').classList.contains('on')){
    if(used.length >= SONGS.length){ used = []; }
    var tries = 0;
    do {
      var s = SONGS[Math.floor(Math.random()*SONGS.length)];
      tries++;
    } while(used.indexOf(s.i) > -1 && tries < 300);
    return s;
  }
  return SONGS[Math.floor(Math.random()*SONGS.length)];
}

var cur = null;

function show(s){
  cur = s;
  if(used.indexOf(s.i) === -1) used.push(s.i);
  $('cnt').textContent = used.length;
  $('name').textContent = s.n;
  $('artist').textContent = s.a;
  $('meta').innerHTML =
    '<span>💿 ' + (s.l || '—') + '</span>' +
    '<span>⏱ ' + s.d + '</span>';
  $('idx').textContent = s._p ? ('#' + s._p) : '';

  // history
  HIST.unshift(s);
  if(HIST.length > 8) HIST.pop();
  renderHist();

  $('card').animate(
    [{opacity:.35, transform:'translateY(6px)'},{opacity:1, transform:'none'}],
    {duration:230, easing:'ease-out'}
  );
}

function renderHist(){
  var h = $('hist');
  if(!HIST.length){ h.innerHTML = '<div class="empty">还没有记录</div>'; return; }
  h.innerHTML = HIST.map(function(s){
    return '<div class="hitem" data-id="'+s.i+'">' +
      '<span class="hn">'+esc(s.n)+'</span>' +
      '<span class="ha">'+esc(s.a)+'</span></div>';
  }).join('');
  Array.prototype.forEach.call(h.querySelectorAll('.hitem'), function(el){
    el.onclick = function(){
      var id = parseInt(el.getAttribute('data-id'),10);
      for(var k=0;k<SONGS.length;k++){ if(SONGS[k].i===id){ show(SONGS[k]); break; } }
    };
  });
}

function esc(t){ return String(t).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function openSong(s){
  if(!s) return;
  var url = 'https://y.music.163.com/m/song?id=' + s.i;
  window.location.href = 'orpheus://song/' + s.i;
  setTimeout(function(){ window.open(url, '_blank'); }, 400);
}

$('next').onclick = function(){ show(pick()); };

$('play').onclick = function(){
  if(!cur) show(pick());
  openSong(cur);
};

$('copy').onclick = function(){
  if(!cur) return;
  var t = cur.n + ' - ' + cur.a;
  if(navigator.clipboard){ navigator.clipboard.writeText(t); }
  var b = $('copy'), o = b.textContent;
  b.textContent = '已复制 ✓';
  setTimeout(function(){ b.textContent = o; }, 1200);
};

$('clear').onclick = function(){
  used = []; HIST = []; $('cnt').textContent = 0; renderHist();
  $('name').textContent = '已清空，再来一首';
  $('artist').textContent = ''; $('meta').innerHTML = ''; $('idx').textContent = '';
};

$('avoid').onclick = function(){ this.classList.toggle('on'); };

renderHist();
</script>
