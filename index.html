<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0a0a0f;color:#fff;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  overscroll-behavior:none;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));
  position:relative;overflow-x:hidden}

/* === 动态背景: 跟随封面主色 === */
.bg{position:fixed;inset:-30%;z-index:-1;filter:blur(64px);opacity:.62;
  transition:opacity .8s;pointer-events:none}
.bg i{position:absolute;display:block;border-radius:50%;
  transition:background 1.1s cubic-bezier(.3,0,.2,1)}
.bg i:nth-child(1){width:56vmax;height:56vmax;left:-18vmax;top:-14vmax;
  background:radial-gradient(circle,var(--k,#c20c0c),transparent 68%)}
.bg i:nth-child(2){width:48vmax;height:48vmax;right:-20vmax;top:22vmax;
  background:radial-gradient(circle,var(--k2,#4b1a6e),transparent 68%)}
.bg i:nth-child(3){width:44vmax;height:44vmax;left:6vmax;bottom:-20vmax;
  background:radial-gradient(circle,var(--k2,#1a3a6e),transparent 70%)}
/* 底色渐变跟随主色, 更沉浸 */
.tint{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:linear-gradient(170deg,var(--k,#0a0a0f) -30%, #0a0a0f 45%);
  opacity:.30;transition:background .9s}

/* 顶栏 */
.top{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;position:relative;z-index:5}
.top h1{font-size:12.5px;font-weight:600;letter-spacing:1.2px;color:#8e93a8;margin:0}
.badge{font-size:11px;color:#8e93a8;background:rgba(255,255,255,.07);
  padding:4px 10px;border-radius:20px;font-variant-numeric:tabular-nums}

/* 歌手筛选条 */
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;
  scrollbar-width:none;position:relative;z-index:5;
  -webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;font-size:12px;color:#8e93a8;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:6px 13px;
  cursor:pointer;transition:all .2s;white-space:nowrap}
.fchip:active{transform:scale(.95)}
.fchip.on{color:#fff;background:var(--k,rgba(194,12,12,.6));
  border-color:transparent;font-weight:600}
.fchip .cnt{opacity:.6;font-size:10.5px;margin-left:3px}

/* 专辑舞台 */
.stage{display:flex;align-items:center;justify-content:center;position:relative;
  padding:4px 0;flex:none;min-height:0}
.disc{position:relative;width:100%;max-width:326px;height:326px;max-height:42vh;
  display:flex;align-items:stretch}

.vinyl{position:absolute;right:-9%;top:5%;width:90%;height:90%;border-radius:50%;
  background:repeating-radial-gradient(circle at center,#17171c 0 3px,#0e0e12 3px 6px);
  box-shadow:0 20px 50px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.06);
  transition:transform .8s cubic-bezier(.22,1,.36,1), opacity .5s;
  opacity:0;z-index:0}
.vinyl::after{content:"";position:absolute;left:50%;top:50%;width:30%;height:30%;
  transform:translate(-50%,-50%);border-radius:50%;
  background:#0a0a0f;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.vinyl .hub{position:absolute;left:50%;top:50%;width:30%;height:30%;
  transform:translate(-50%,-50%);border-radius:50%;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:background .9s}
.playing .vinyl{transform:translateX(15%) rotate(18deg);opacity:1}

.cover{position:relative;z-index:2;width:100%;height:100%;border-radius:19px;
  overflow:hidden;background:#16161d;
  box-shadow:0 22px 56px rgba(0,0,0,.66), 0 0 0 1px rgba(255,255,255,.07);
  transition:transform .45s cubic-bezier(.22,1,.36,1), box-shadow .45s}
.cover img{width:100%;height:100%;object-fit:cover;display:block;background:#16161d}
.glow{position:absolute;inset:-10%;z-index:1;border-radius:50%;
  background:radial-gradient(circle,var(--k,rgba(194,12,12,.5)),transparent 66%);
  filter:blur(36px);opacity:0;transition:opacity .7s,background .9s}
.glow.on{opacity:.8}

.pop{animation:pop .62s cubic-bezier(.16,1.02,.3,1)}
@keyframes pop{
  0%{transform:scale(.74) translateY(32px) rotate(-4deg)}
  55%{transform:scale(1.035) translateY(-4px) rotate(1deg)}
  100%{transform:scale(1) translateY(0) rotate(0)}
}

/* 空态 */
.empty{width:100%;height:100%;border-radius:19px;
  border:1.5px dashed rgba(255,255,255,.14);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;color:#8e93a8}
.empty .big{font-size:44px;opacity:.5}
.empty span{font-size:13px}

/* 洗牌中悬念遮罩 */
.shuffling{position:absolute;inset:0;z-index:6;border-radius:19px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(10,10,15,.82);backdrop-filter:blur(3px);opacity:0;
  pointer-events:none;transition:opacity .16s}
.shuffling.on{opacity:1}
.dots{display:flex;gap:9px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--k,#c20c0c);
  animation:bounce .62s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.14s}
.dots i:nth-child(3){animation-delay:.28s}
@keyframes bounce{0%,80%,100%{transform:scale(.55);opacity:.4}
  40%{transform:scale(1);opacity:1}}

/* 信息区 */
.info{margin-top:16px;text-align:center;min-height:74px}
.sname{font-size:19.5px;font-weight:700;line-height:1.3;margin:0 0 6px;
  word-break:break-word;letter-spacing:-.2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sartist{font-size:14px;color:var(--k,#ff3b3b);font-weight:600;margin-bottom:5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .9s}
.smeta{font-size:11.5px;color:#8e93a8;display:flex;gap:9px;justify-content:center;
  align-items:center;flex-wrap:wrap}
.smeta em{font-style:normal;opacity:.5}
.anim-in{animation:fin .42s ease-out}
@keyframes fin{from{transform:translateY(9px)}to{transform:none}}

/* 控制区 */
.ctrls{margin-top:16px;display:flex;flex-direction:column;gap:10px;flex:none}
.mainrow{display:flex;gap:10px;align-items:stretch}
button{font:inherit;border:none;cursor:pointer;color:#fff;
  transition:transform .13s,opacity .13s,background .25s;background:none}
button:active{transform:scale(.955);opacity:.86}
.dice{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
  background:#c20c0c;
  border-radius:17px;padding:16px 14px;font-size:16.5px;font-weight:700;
  box-shadow:0 8px 26px var(--ks,rgba(194,12,12,.4)), inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .13s,background .7s,box-shadow .7s}
.dice .ic{font-size:19px}
.spin .ic{animation:spin .5s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
.go{width:58px;flex:none;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);
  border-radius:17px;font-size:20px}

.minirow{display:flex;gap:9px}
.minirow button{flex:1;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.09);border-radius:13px;
  padding:11px 6px;font-size:12.5px;font-weight:500;color:#8e93a8}
.minirow button.on{color:#fff;border-color:transparent;
  background:var(--k2,rgba(194,12,12,.35));font-weight:600}

/* 历史 */
.hist{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;
  max-height:70px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hchip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:4px 10px 4px 4px;
  font-size:11.5px;color:#8e93a8;max-width:100%;cursor:pointer;transition:background .15s}
.hchip:active{background:rgba(255,255,255,.13)}
.hchip img{width:22px;height:22px;border-radius:5px;object-fit:cover;flex:none}
.hchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
  transform:translate(-50%,22px);background:rgba(32,32,40,.96);
  border:1px solid rgba(255,255,255,.14);border-radius:13px;
  padding:11px 19px;font-size:13.5px;opacity:0;pointer-events:none;
  transition:all .28s cubic-bezier(.2,1,.3,1);backdrop-filter:blur(12px);z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}
.copybox{position:fixed;opacity:0;pointer-events:none;left:-9999px}
</style>
</head>

<script>
var SONGS = window.SONGS || [];
var $ = function(id){ return document.getElementById(id); };
var used = [], HIST = [], cur = null, curFilter = null;

$('badge').textContent = SONGS.length + ' 首';

/* ============ 封面 URL ============ */
function pic(url, size){
  if(!url) return '';
  var u = url.split('?')[0];
  var m = u.match(/^([1234]):(.*)$/);
  if(m) u = 'https://p' + m[1] + '.music.126.net/' + m[2];
  return u + '?param=' + size + 'x' + size;
}

/* ============ 颜色工具 ============ */
function hex2rgb(h){
  h = h.replace('#','');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function rgb2hex(r,g,b){ return '#'+[r,g,b].map(function(v){
  v=Math.max(0,Math.min(255,Math.round(v))); return v.toString(16).padStart(2,'0'); }).join(''); }
function mix(h, target, amt){
  var a=hex2rgb(h), b=hex2rgb(target);
  return rgb2hex(a[0]+(b[0]-a[0])*amt, a[1]+(b[1]-a[1])*amt, a[2]+(b[2]-a[2])*amt);
}

/* 用封面主色驱动整个界面主题 */
function applyTheme(s){
  var k = s.k || '#c20c0c';
  var k2 = s.k2 || k;
  var root = document.documentElement.style;
  root.setProperty('--k', k);
  root.setProperty('--k2', k2);
  // 按钮渐变: 主色 -> 加深的主色
  var kd = mix(k, '#000000', 0.42);
  root.setProperty('--kd', kd);
  // 阴影带透明
  var rgb = hex2rgb(k);
  root.setProperty('--ks', 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.42)');

  // === WebKit 不会在 gradient 里重解析 CSS 变量, 必须直接写 style ===
  var glow = document.querySelectorAll('.bg i');
  if(glow.length >= 3){
    glow[0].style.background = 'radial-gradient(circle,' + k + ',transparent 68%)';
    glow[1].style.background = 'radial-gradient(circle,' + k2 + ',transparent 68%)';
    glow[2].style.background = 'radial-gradient(circle,' + mix(k2,k,0.35) + ',transparent 70%)';
  }
  var tint = document.getElementById('tint');
  if(tint) tint.style.background =
    'linear-gradient(170deg,' + k + ' -30%, #0a0a0f 45%)';

  // 光晕 & 唱片中轴 & 播放按钮的小圆点也用主色
  var gl = document.getElementById('glow');
  if(gl) gl.style.background = 'radial-gradient(circle,' + rgba(k,0.55) + ',transparent 66%)';

  // 三个点动画色
  Array.prototype.forEach.call(document.querySelectorAll('.dots i'), function(d){
    d.style.background = k;
  });

  // 抽歌按钮渐变 (WebKit 不支持 gradient 内变量)
  var dice = document.getElementById('dice');
  if(dice){
    // 主色偏亮 -> 加深, 保证渐变层次
    var top = mix(k, '#ffffff', 0.12);
    dice.style.background = 'linear-gradient(135deg,' + k + ',' + kd + ')';
  }

  // 唱片中轴
  var vinyl = document.querySelector('.vinyl');
  if(vinyl){
    // 用伪元素做不到动态色, 改写 ::after 不可行 -> 用内联子元素
    var hub = vinyl.querySelector('.hub');
    if(!hub){
      hub = document.createElement('div');
      hub.className = 'hub';
      vinyl.appendChild(hub);
    }
    hub.style.background = 'radial-gradient(circle,' + k + ' 0 34%,transparent 35%),#0a0a0f';
  }

  // "不重复"按钮底色
  var av = document.getElementById('avoid');
  if(av && av.classList.contains('on')) av.style.background = rgba(k2, 0.38);
}
function rgba(h, a){
  var c = hex2rgb(h);
  return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
}

/* ============ 音效 (WebAudio 合成, 无需外部文件) ============ */
var AC = null;
function beep(freq, dur, type, gain){
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq * 0.55, AC.currentTime + dur);
    g.gain.setValueAtTime(gain || 0.13, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  }catch(e){}
}
function sfxShuffle(){
  // 洗牌: 三声急促上升的短音
  beep(320, .06, 'square', .07);
  setTimeout(function(){ beep(430, .06, 'square', .07); }, 55);
  setTimeout(function(){ beep(560, .07, 'square', .07); }, 110);
}
function sfxPop(){
  // 弹出: 一声清脆的下滑音 + 轻"嗒"
  beep(880, .12, 'triangle', .10);
  setTimeout(function(){ beep(1320, .07, 'sine', .07); }, 40);
}

/* ============ 歌手筛选 ============ */
function buildFilters(){
  var cnt = {};
  SONGS.forEach(function(s){
    // 与 matchFilter 保持同一口径: 合作曲的每个歌手都算
    var arts = (s.a || '').split('/');
    var seen = {};
    arts.forEach(function(a){
      a = a.trim();
      if(!a || seen[a]) return;
      seen[a] = 1;
      cnt[a] = (cnt[a] || 0) + 1;
    });
  });
  var list = Object.keys(cnt).map(function(k){ return [k, cnt[k]]; })
    .sort(function(a,b){ return b[1]-a[1]; });
  // 只显示 3 首以上的歌手, 避免几百个碎片
  var top = list.filter(function(x){ return x[1] >= 3; }).slice(0, 40);

  var html = '<button class="fchip on" data-artist="">全部<span class="cnt">' +
    SONGS.length + '</span></button>';
  top.forEach(function(x){
    html += '<button class="fchip" data-artist="' + esc(x[0]) + '">' +
      esc(x[0]) + '<span class="cnt">' + x[1] + '</span></button>';
  });
  $('filters').innerHTML = html;
  Array.prototype.forEach.call($('filters').querySelectorAll('.fchip'), function(el){
    el.onclick = function(){
      Array.prototype.forEach.call(el.parentNode.querySelectorAll('.fchip'), function(x){
        x.classList.remove('on');
      });
      el.classList.add('on');
      curFilter = el.getAttribute('data-artist') || null;
      used = [];   // 换筛选重置去重池
      cur = null;
      var n = curFilter ? SONGS.filter(matchFilter).length : SONGS.length;
      $('badge').textContent = n + ' 首';
      // 同步"不重复"底色
      var av = $('avoid');
      if(av.classList.contains('on')){
        var k2 = getComputedStyle(document.documentElement).getPropertyValue('--k2').trim() || '#4b1a6e';
        av.style.background = rgba(k2, 0.38);
      }
      toast(curFilter ? ('只看 ' + curFilter + ' · ' + n + ' 首') : ('全部 ' + n + ' 首'));
    };
  });
}
function matchFilter(s){
  if(!curFilter) return true;
  return (s.a || '').indexOf(curFilter) > -1;
}

/* ============ 抽歌 ============ */
function pool(){ return SONGS.filter(matchFilter); }

function pick(){
  var p = pool();
  if(!p.length) return null;
  if($('avoid').classList.contains('on')){
    // 去重池只记录当前筛选范围内的
    var avail = p.filter(function(s){ return used.indexOf(s.i) === -1; });
    if(!avail.length){ used = []; avail = p; }
    return avail[Math.floor(Math.random()*avail.length)];
  }
  return p[Math.floor(Math.random()*p.length)];
}

var preloadCache = {};
function preload(s){
  if(!s) return;
  var u = pic(s.c, 500);
  if(preloadCache[u]) return;
  var im = new Image(); im.src = u; preloadCache[u] = 1;
}

/* ============ 渲染 ============ */
function render(s, opts){
  if(!s) return;
  opts = opts || {};
  cur = s;
  if(used.indexOf(s.i) === -1) used.push(s.i);

  // 1. 主题色跟随封面
  applyTheme(s);

  // 2. 封面
  var cv = $('cover');
  cv.innerHTML = '';
  var img = document.createElement('img');
  img.onload = function(){ img.style.opacity = '1'; };
  img.onerror = function(){ img.style.opacity = '1'; };
  img.src = pic(s.c, 500);
  img.alt = s.n;
  cv.appendChild(img);

  // 3. 弹出动画
  cv.classList.remove('pop');
  void cv.offsetWidth;
  cv.classList.add('pop');
  clearTimeout(cv._popT);
  cv._popT = setTimeout(function(){ cv.classList.remove('pop'); }, 640);

  $('glow').classList.add('on');
  $('disc').classList.add('playing');

  // 4. 文字
  $('name').textContent = s.n;
  $('artist').textContent = s.a;
  $('meta').innerHTML = '<span>' + esc(s.l || '—') + '</span>' +
    '<em>·</em><span>' + s.d + '</span>' +
    '<em>·</em><span>#' + s.p + '</span>';
  $('name').style.color = '';
  $('artist').style.color = '';
  reanim($('info'));

  // 5. 历史
  HIST.unshift(s);
  if(HIST.length > 12) HIST.pop();
  renderHist();
  preload(s);
}

function reanim(el){
  el.classList.remove('anim-in');
  void el.offsetWidth;
  el.classList.add('anim-in');
}

function renderHist(){
  var h = $('hist');
  h.innerHTML = HIST.map(function(s){
    return '<div class="hchip" data-id="'+s.i+'">' +
      '<img src="'+pic(s.c,80)+'" alt="" loading="lazy">' +
      '<span>'+esc(s.n)+'</span></div>';
  }).join('');
  Array.prototype.forEach.call(h.querySelectorAll('.hchip'), function(el){
    el.onclick = function(){
      var id = +el.getAttribute('data-id');
      for(var k=0;k<SONGS.length;k++){
        if(SONGS[k].i === id){ render(SONGS[k]); sfxPop(); break; }
      }
    };
  });
}

function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._t);
  t._t = setTimeout(function(){ t.classList.remove('on'); }, 1700);
}

/* ============ 复制 ============ */
function copyText(txt){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(function(){ toast('已复制 ✓'); })
      .catch(function(){ fallbackCopy(txt); });
  } else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  var box = $('copybox');
  box.value = txt;
  box.select(); box.setSelectionRange(0, 99999);
  try{
    var ok = document.execCommand('copy');
    toast(ok ? '已复制 ✓' : '请长按曲名手动复制');
  }catch(e){ toast('请长按曲名手动复制'); }
  box.blur();
}

/* ============ 抽歌主流程 (含洗牌悬念 + 音效) ============ */
var busy = false;
function doShuffle(){
  if(busy) return;
  busy = true;

  // 首次交互解锁音频
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }

  sfxShuffle();
  $('shuffling').classList.add('on');
  $('dice').classList.add('spin');
  var b = $('dice');
  b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');

  var s = pick();
  preload(s);

  // 悬念时长: 稍作停顿再揭晓
  setTimeout(function(){
    render(s);
    sfxPop();
    $('shuffling').classList.remove('on');
    busy = false;
  }, 420);
}

/* ============ 事件 ============ */
$('dice').onclick = doShuffle;

$('go').onclick = function(){
  if(!cur){ doShuffle(); return; }
  var id = cur.i;
  window.location.href = 'orpheus://song/' + id;
  setTimeout(function(){
    window.open('https://y.music.163.com/m/song?id=' + id, '_blank');
  }, 500);
};

$('copy').onclick = function(){
  if(!cur){ toast('先抽一首'); return; }
  copyText(cur.n + ' - ' + cur.a);
};

$('clear').onclick = function(){
  used = []; HIST = []; cur = null;
  renderHist();
  $('cover').innerHTML = '<div class="empty"><div class="big">🎲</div><span>点下面抽一首</span></div>';
  $('glow').classList.remove('on');
  $('disc').classList.remove('playing');
  $('name').textContent = '已清空';
  $('artist').textContent = '';
  $('meta').innerHTML = '';
  applyTheme({ k:'#c20c0c', k2:'#4b1a6e' });
  reanim($('info'));
  toast('已清空');
};

$('avoid').onclick = function(){
  this.classList.toggle('on');
  var on = this.classList.contains('on');
  // 内联色需要同步更新
  if(on){
    var k2 = getComputedStyle(document.documentElement).getPropertyValue('--k2').trim() || '#4b1a6e';
    this.style.background = rgba(k2, 0.38);
  } else {
    this.style.background = '';
  }
  toast(on ? '不重复已开' : '不重复已关');
};

document.addEventListener('keydown', function(e){
  if(e.code === 'Space'){ e.preventDefault(); doShuffle(); }
});

/* ============ 初始化 ============ */
buildFilters();
renderHist();

// 注册 Service Worker (提升主屏 App 的启动体验)
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

/* ============ 添加到主屏引导 ============ */
(function(){
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if(standalone) return;                        // 已经是 App 模式, 不打扰

  // 只对 iOS Safari 显示
  var ua = navigator.userAgent;
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  if(!isIOS || !isSafari) return;

  try{
    if(localStorage.getItem('a2hs_dismissed') === '1') return;
  }catch(e){}

  var bar = document.createElement('div');
  bar.id = 'a2hs';
  bar.innerHTML =
    '<div class="a2hs-txt">' +
      '<b>加到主屏幕</b>' +
      '<span>点下方 <i>⎋</i> 分享 → 「添加到主屏幕」，秒变 App</span>' +
    '</div>' +
    '<button class="a2hs-x" aria-label="关闭">✕</button>';
  document.body.appendChild(bar);

  var st = document.createElement('style');
  st.textContent =
    '#a2hs{position:fixed;left:12px;right:12px;' +
      'bottom:calc(12px + env(safe-area-inset-bottom));z-index:120;' +
      'display:flex;align-items:center;gap:10px;' +
      'background:rgba(28,28,36,.97);border:1px solid rgba(255,255,255,.14);' +
      'border-radius:15px;padding:13px 14px;backdrop-filter:blur(14px);' +
      'box-shadow:0 12px 34px rgba(0,0,0,.5);' +
      'transform:translateY(140%);transition:transform .45s cubic-bezier(.2,1,.3,1)}' +
    '#a2hs.on{transform:translateY(0)}' +
    '#a2hs .a2hs-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}' +
    '#a2hs b{font-size:13.5px;font-weight:650;color:#fff}' +
    '#a2hs span{font-size:11.5px;color:#8e93a8;line-height:1.45}' +
    '#a2hs i{font-style:normal;display:inline-block;color:#ff3b3b;font-size:13px}' +
    '#a2hs .a2hs-x{width:30px;height:30px;flex:none;border-radius:9px;' +
      'background:rgba(255,255,255,.09);color:#8e93a8;font-size:13px}' +
    '#a2hs .a2hs-x:active{background:rgba(255,255,255,.18)}';
  document.head.appendChild(st);

  setTimeout(function(){ bar.classList.add('on'); }, 900);

  bar.querySelector('.a2hs-x').onclick = function(){
    bar.classList.remove('on');
    try{ localStorage.setItem('a2hs_dismissed', '1'); }catch(e){}
    setTimeout(function(){ bar.remove(); }, 500);
  };
})();
</script>
